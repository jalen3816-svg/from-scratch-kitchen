# =====================================================================
# From Scratch Kitchen — Content Manager settings
# =====================================================================
# Login is handled by DecapBridge (free). When you set up your
# DecapBridge account it gives you three values — paste them into the
# THREE spots marked  <<< REPLACE  below, then save. That's the only
# editing this file needs.
# =====================================================================

backend:
  name: git-gateway
  repo: YOUR-GITHUB-USERNAME/from-scratch-kitchen   # <<< REPLACE (DecapBridge gives you this)
  branch: main
  identity_url: https://auth.decapbridge.com/sites/YOUR-SITE-ID   # <<< REPLACE (from DecapBridge)
  gateway_url: https://gateway.decapbridge.com

# Nicer commit messages (optional, safe to leave as-is)
commit_messages:
  create: 'Add {{collection}} — {{author-name}}'
  update: 'Update {{collection}} — {{author-name}}'
  delete: 'Remove {{collection}} — {{author-name}}'
  uploadMedia: 'Upload image — {{author-name}}'
  deleteMedia: 'Remove image — {{author-name}}'

# Where uploaded photos are saved in the project, and the URL they use on the site
media_folder: "images"
public_folder: "/images"

# Friendlier labels in the editor
site_url: https://YOUR-SITE.netlify.app   # <<< REPLACE with your live site address (optional but nice)

collections:
  - name: content
    label: "Website Content"
    description: "Edit your menu, photos, reviews, and business info, then click Publish."
    files:
      - name: site
        label: "Business Info & Hours"
        file: "data/site.json"
        fields:
          - { name: phone, label: "Phone number", widget: string, required: false, hint: "Leave blank to keep it private." }
          - { name: phone_public, label: "Show the phone number on the website?", widget: boolean, default: false }
          - { name: email, label: "Email address", widget: string, required: false }
          - { name: address, label: "Pickup address", widget: string, required: false }
          - { name: show_map, label: "Show a map with the pickup address?", widget: boolean, default: false }
          - { name: owner_photo, label: "Owner photo (Our Story section)", widget: image, required: false }
          - name: hours
            label: "Order & Pickup Hours"
            widget: list
            fields:
              - { name: days, label: "Days", widget: string }
              - { name: time, label: "Time", widget: string }
          - { name: show_stats, label: "Show the stats bar (rating / plates served)?", widget: boolean, default: false }
          - { name: stat_rating, label: "Rating (e.g. ★★★★★) — only if true", widget: string, required: false }
          - { name: stat_served, label: "Plates served (e.g. 500+) — only if true", widget: string, required: false }
          - { name: stat_handmade, label: "Handmade (e.g. 100%)", widget: string, required: false, default: "100%" }

      - name: menu
        label: "Menu Items"
        file: "data/menu.json"
        fields:
          - name: items
            label: "Menu items"
            label_singular: "menu item"
            widget: list
            fields:
              - { name: name, label: "Name", widget: string }
              - { name: description, label: "Description", widget: text, required: false }
              - { name: price, label: "Price", widget: string, required: false }
              - { name: image, label: "Photo", widget: image, required: false }

      - name: gallery
        label: "Gallery Photos"
        file: "data/gallery.json"
        fields:
          - name: items
            label: "Photos"
            label_singular: "photo"
            widget: list
            fields:
              - { name: image, label: "Photo", widget: image }
              - { name: alt, label: "Short description (for accessibility)", widget: string, required: false }

      - name: reviews
        label: "Reviews"
        file: "data/reviews.json"
        fields:
          - name: items
            label: "Reviews"
            label_singular: "review"
            widget: list
            required: false
            fields:
              - { name: quote, label: "What they said", widget: text }
              - { name: name, label: "Name", widget: string }
              - { name: detail, label: "Detail (e.g. 'East Side Detroit · repast')", widget: string, required: false }
              - { name: stars, label: "Stars (1–5)", widget: number, default: 5, value_type: int, min: 1, max: 5 }
